<aside
  class="sidebar"
  [class.open]="open()"
>

  <!-- BRAND -->

  <div class="brand">

    <div class="brand-logo">
      <img src="/favicon.svg" alt="NEXORA logo" width="34" height="34" />
    </div>

    <span class="brand-name">
      NEXORA
    </span>

  </div>


  <!-- NAVIGATION -->

  <nav class="navigation">

    <div class="nav-section">

      <span class="nav-section-title">
        MAIN
      </span>

      @for (item of navigationItems; track item.route) {

        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closed.emit()"
        >

          <i
            [class]="item.icon"
            aria-hidden="true"
          ></i>

          <span>
            {{ item.label }}
          </span>

        </a>

      }

    </div>


    <!-- SYSTEM -->

    <div class="nav-section bottom-section">

      <span class="nav-section-title">
        SYSTEM
      </span>

      <a
        class="nav-item"
        routerLink="/settings"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closed.emit()"
      >

        <i
          class="pi pi-cog"
          aria-hidden="true"
        ></i>

        <span>
          Settings
        </span>

      </a>

    </div>

  </nav>

</aside>
