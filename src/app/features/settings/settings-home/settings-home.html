<section class="settings-page nx-page">
  <header class="settings-heading"><div class="heading-icon"><i class="pi pi-cog" aria-hidden="true"></i></div><div><p class="eyebrow">WORKSPACE</p><h1>Settings</h1><p class="subtitle">Manage your workspace appearance, organization branding, and day-to-day tools.</p></div></header>
  <div class="settings-grid">
    <button class="settings-card" type="button" (click)="theme.toggle()"><span class="settings-icon"><i [class]="theme.isDark() ? 'pi pi-moon' : 'pi pi-sun'"></i></span><span class="settings-copy"><strong>Appearance</strong><span>Switch between light and dark themes.</span><small>Current theme: {{ theme.isDark() ? 'Dark' : 'Light' }}</small></span><i class="pi pi-angle-right card-arrow"></i></button>
    <button class="settings-card" type="button" (click)="open('/settings/branding')"><span class="settings-icon"><i class="pi pi-palette"></i></span><span class="settings-copy"><strong>Organization branding</strong><span>Manage the company logo and invoice/receipt footer text.</span><small>Organization administrators</small></span><i class="pi pi-angle-right card-arrow"></i></button>
    <button class="settings-card" type="button" (click)="open('/notifications')"><span class="settings-icon"><i class="pi pi-bell"></i></span><span class="settings-copy"><strong>Notifications</strong><span>Review alerts and updates related to your workspace.</span><small>Notification center</small></span><i class="pi pi-angle-right card-arrow"></i></button>
    <button class="settings-card" type="button" (click)="open('/settings/ai-prompt')"><span class="settings-icon"><i class="pi pi-sliders-h"></i></span><span class="settings-copy"><strong>AI prompt preferences</strong><span>Customize organization-specific AI response instructions.</span><small>Admin and Manager access</small></span><i class="pi pi-angle-right card-arrow"></i></button>
    <button class="settings-card" type="button" (click)="open('/ai-assistant')"><span class="settings-icon"><i class="pi pi-sparkles"></i></span><span class="settings-copy"><strong>AI assistant</strong><span>Open safe troubleshooting guidance for field-service work.</span><small>Requires AI integration to be enabled</small></span><i class="pi pi-angle-right card-arrow"></i></button>
  </div>
  <p class="settings-note"><i class="pi pi-shield"></i> Access to organization data and configuration is still controlled by your account permissions on the backend.</p>
</section>
