
<div class="invitation-page">
  <section class="invitation-card">
    <div class="brand-mark"><img src="/favicon.svg" alt="NEXORA logo" /></div>

    <h1>Activate your account</h1>
    <p class="subtitle">
      Create a secure password to join your organization on NEXORA.
    </p>

    <div class="alert error" *ngIf="errorMessage()">
      {{ errorMessage() }}
    </div>

    <div class="alert success" *ngIf="successMessage()">
      {{ successMessage() }}
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-field">
        <label for="password">New password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="At least 12 characters"
        />

        <small
          class="field-error"
          *ngIf="form.controls.password.touched &&
                 form.controls.password.hasError('required')">
          Password is required.
        </small>

        <small
          class="field-error"
          *ngIf="form.controls.password.touched &&
                 form.controls.password.hasError('minlength')">
          Password must contain at least 12 characters.
        </small>
      </div>

      <div class="form-field">
        <label for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          placeholder="Re-enter your password"
        />
      </div>

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Activating account...' : 'Activate account' }}
      </button>
    </form>

    <a routerLink="/login" class="login-link">
      Already have an account? Sign in
    </a>
  </section>
</div>
