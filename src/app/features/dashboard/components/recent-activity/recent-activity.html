<div class="activity-card"><div class="activity-header"><div><p class="section-eyebrow">LIVE UPDATES</p><h2>Recent Notifications</h2></div><button type="button" class="view-all-button" (click)="router.navigate(['/notifications'])">View all <i class="pi pi-arrow-right"></i></button></div>@if(activities().length){<div class="activity-list">@for(activity of activities();track activity.id){<button type="button" class="activity-item" (click)="open(activity)"><div class="activity-icon info"><i [class]="icon(activity.type)"></i></div><div class="activity-content"><strong>{{activity.title}}</strong><p>{{activity.message}}</p></div><span class="activity-time">{{activity.createdAt | date:'short'}}</span></button>}</div>}@else{<div class="activity-empty"><i class="pi pi-inbox"></i><p>{{failed()?'Live notifications are temporarily unavailable.':'No notifications have been recorded yet.'}}</p></div>}</div>
